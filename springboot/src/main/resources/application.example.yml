# =====================================================
# 配置模板示例（可安全提交到仓库）
# 使用方式:复制为 application.yml 并填入真实环境变量
#   开发环境: Windows PowerShell
#     $env:DB_PASSWORD="你的数据库密码"
#     $env:REDIS_PASSWORD="你的Redis密码"
#     $env:ES_PASSWORD="你的ES密码"
#     $env:DEEPSEEK_API_KEY="sk-xxx"
#     $env:MIMO_API_KEY="sk-xxx"
#     $env:QIANWEN_API_KEY="sk-xxx"
#     $env:JWT_SECRET="随机64位字符串"
# =====================================================
spring:
  application:
    name: mythweave
  datasource:
    url: jdbc:mysql://localhost:3306/mythweave?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
    elasticsearch:
      uris: http://localhost:9200
      username: elastic
      password: ${ES_PASSWORD:}
      # 无 ES 环境下快速失败并触发熔断，避免调用长时间挂起
      connection-timeout: 3s
      socket-timeout: 10s

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh_cn

server:
  port: 8080

# 文件上传 & 哨兵巡查配置
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: 86400000
  upload:
    # 头像存储路径（按本机实际路径修改）
    avatar-path: ${AVATAR_PATH:./vue/public/avatar}
  sentinel:
    chunk-size: 10
    thread-pool-size: 4
    incremental-threshold: 5
    overdue-threshold: 10
    auto-check-enabled: true
    # 人物巡查
    character-protagonist-threshold: 5
    character-supporting-threshold: 10
    character-arc-stall-threshold: 20
    # 逻辑巡查
    logic-min-words: 50
    logic-consecutive-short: 3
    # 节奏巡查
    rhythm-monotony-threshold: 0.15
    rhythm-spike-threshold: 0.50
    rhythm-monotony-window: 3
    rhythm-long-chapter-multiplier: 1.8
    rhythm-consecutive-short: 4
    rhythm-short-word-threshold: 500

# DeepSeek AI 配置
mythweave:
  # Elasticsearch 向量检索：
  # - enabled=false 时完全禁用：不加载 ES 自动配置与相关 Bean，本地无 ES 环境可放心关闭
  # - enabled=true 时启动异步探测，无 ES 仅降级不影响 AI 创作；连接失败自动熔断重试
  es:
    enabled: ${ES_ENABLED:true}
    # 连接失败后的熔断冷却时间，冷却结束自动重试探测
    retry-after: 60s
  # AI 安全策略：输入过滤/输出审核/频率限制
  security:
    enabled: ${SECURITY_ENABLED:true}
    # 敏感词库（输入过滤与输出审核共用），按需填写明确违规词汇
    sensitive-words: []
    rate-limit:
      free-limit: 30
      vip-limit: 120
      window-seconds: 60
      violation-threshold: 5
      cooldown-seconds: 300
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      model: deepseek-v4-flash
      # 思考模式（V4: thinking.type）：enabled=思考（默认，响应携带 reasoning_content）/ disabled=非思考
      thinking: ${DEEPSEEK_THINKING:enabled}
      # 思考强度（reasoning_effort）：low/high/max，仅思考模式生效；思考与正文共享 max_tokens 预算，长文生成建议 low 或 high 留预算给正文
      reasoning-effort: ${DEEPSEEK_REASONING_EFFORT:high}
      # 思考模式调用失败（网络/5xx/仅推理无正文等）时自动降级为非思考模式重试一次
      degrade-on-failure: ${DEEPSEEK_DEGRADE_ON_FAILURE:true}
      max-token: 4096
      temperature: 0.7
      top-p: 0.9
      stream-timeout: 120s
      connect-timeout: 10s
      read-timeout: 120s
    mimo:
      api-key: ${MIMO_API_KEY:}
      base-url: https://api.mimoai.cn/v1
      model: mimo-2.5-pro
      max-token: 4096
      temperature: 0.7
      top-p: 0.9
      stream-timeout: 120s
      connect-timeout: 10s
      read-timeout: 120s

    qianwen:
      api-key: ${QIANWEN_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/api/v1
      embedding-endpoint: /service/embeddings/text-embedding/text-embedding
      model: text-embedding-v3
      dimensions: 1024
