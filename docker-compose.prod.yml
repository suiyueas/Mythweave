# ========================================================
# Mythweave AI 生产环境覆盖配置
# 用法：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#       docker compose -f docker-compose.yml -f docker-compose.prod.yml down
#
# 本文件在开发编排（docker-compose.yml）基础上叠加生产加固：
#   1. 网络安全隔离：MySQL/Redis/ES 移入 internal 网络（仅后端可达，宿主机不可直连），
#      并移除其宿主机端口暴露；前端改为仅监听 127.0.0.1
#   2. 资源限制：为每个容器设定 CPU/内存上限（docker compose up 即生效）
#   3. 日志配置：json-file 驱动 + 轮转（单文件 50M、保留 5 份）
#   4. 其他加固：Redis 内存上限与淘汰策略、后端 init/优雅停机/no-new-privileges
#
# 注意：依赖 `!override` 合并语义，需要 Docker Compose v2.24+
# ========================================================
services:
  # ==================== MySQL：内网隔离，无宿主机端口 ====================
  mysql:
    networks: !override
      - mythweave-internal
    ports: !override []
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ==================== Redis：内网隔离 + 内存上限与淘汰策略 ====================
  redis:
    networks: !override
      - mythweave-internal
    ports: !override []
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ==================== Elasticsearch：内网隔离 ====================
  elasticsearch:
    networks: !override
      - mythweave-internal
    ports: !override []
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ==================== 后端：双网络（对外 + 内网基础设施）+ 进程/停机加固 ====================
  backend:
    networks:
      - mythweave-internal
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # ==================== 前端：仅本机监听，生产建议前置主机级反向代理做 TLS ====================
  frontend:
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-80}:80"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

# 基础设施专用内网（无网关，容器无法访问外网，也无法从外部直连）
networks:
  mythweave-internal:
    driver: bridge
    internal: true
